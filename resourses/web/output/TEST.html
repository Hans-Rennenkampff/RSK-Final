<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search with Dropdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .dropdown {
            position: relative;
            width: 300px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            /* Убираем overflow: hidden; */
        }
        .dropdown input[type="text"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 1px solid #ddd;
            outline: none;
            font-size: 16px;
            border-radius: 8px 8px 0 0; /* Добавляем закругление только для верхней части */
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%; /* Ставим на уровне нижней границы поля ввода */
            left: 0;
            right: 0;
            background-color: #fff;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1;
            max-height: 200px;
            overflow-y: auto;
        }
        .dropdown-content a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            transition: background-color 0.3s;
            font-size: 14px;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
        .show {
            display: block !important;
        }
    </style>
</head>
<body>

<div class="dropdown">
    <input type="text" id="searchInput" onkeyup="filterFunction()" placeholder="Search...">
    <div id="myDropdown" class="dropdown-content">
        <a href="#">ИС-4</a>
        <a href="#">ИС-3</a>
        <a href="#">ИС-22</a>
    </div>
</div>

<script>
function filterFunction() {
    var input, filter, div, a, i;
    input = document.getElementById("searchInput");
    filter = input.value.toUpperCase();
    div = document.getElementById("myDropdown");

    if (filter.length > 0) {
        div.classList.add('show');
    } else {
        div.classList.remove('show');
    }

    a = div.getElementsByTagName("a");
    for (i = 0; i < a.length; i++) {
        txtValue = a[i].textContent || a[i].innerText;
        if (txtValue.toUpperCase().indexOf(filter) > -1) {
            a[i].style.display = "";
        } else {
            a[i].style.display = "none";
        }
    }
}
</script>

</body>
</html>
